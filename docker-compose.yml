version: '3.8'

services:
  postgres-primary:
    build:
      context: ./replication/primary
    container_name: postgres-primary
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    volumes:
      - ./primary-data:/var/lib/postgresql/data
      - ./replication/primary/init:/docker-entrypoint-initdb.d/
    networks:
      - postgres-net

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: main_db
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary
    volumes:
      - ./replica-data:/var/lib/postgresql/data
      - ./replication/replica/init:/docker-entrypoint-initdb.d/
    command: ["/docker-entrypoint-initdb.d/01-replica-entrypoint.sh"]
    networks:
      - postgres-net

networks:
  postgres-net:
    driver: bridge
